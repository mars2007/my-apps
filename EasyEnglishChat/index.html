<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Easy English Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f4;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: #0066cc;
      color: #fff;
      padding: 0.8rem 1rem;
      text-align: center;
      font-weight: bold;
    }
    #status {
      font-size: 0.8rem;
      padding: 0.3rem 1rem;
      background: #e9f2ff;
      color: #004a99;
      white-space: pre-line;
    }

    /* メインレイアウト：左右2カラム */
    main {
      flex: 1;
      display: flex;
      flex-direction: row;
      padding: 0.5rem;
      gap: 0.5rem;
      box-sizing: border-box;
    }
    #left-panel,
    #right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      min-width: 0;
    }

    /* 左側：提案＋設定 */
    #suggestions-panel {
      background: #ffffff;
      border-radius: 8px;
      border: 1px solid #ddd;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      height: 50%;
      min-height: 120px;
    }
    #suggestions-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.3rem;
      font-size: 0.85rem;
      font-weight: bold;
    }
    #suggestions-list {
      flex: 1;
      overflow-y: auto;
      font-size: 0.85rem;
      border-top: 1px solid #eee;
      padding-top: 0.3rem;
    }
    .suggestion-item {
      padding: 0.25rem 0.35rem;
      margin-bottom: 0.2rem;
      background: #f5f9ff;
      border-radius: 6px;
      cursor: pointer;
    }
    .suggestion-item:hover {
      background: #e2efff;
    }

    #settings-panel {
      background: #ffffff;
      border-radius: 8px;
      border: 1px solid #ddd;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      height: 50%;
      min-height: 190px;
      font-size: 0.85rem;
    }
    #settings-panel label {
      font-weight: bold;
      display: block;
      margin-bottom: 0.1rem;
    }
    #settings-panel input,
    #settings-panel textarea,
    #settings-panel select {
      width: 100%;
      box-sizing: border-box;
      font-size: 0.85rem;
      padding: 0.3rem;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    #base-prompt-input {
      min-height: 3rem;
      resize: vertical;
      font-size: 0.8rem;
    }
    #apply-settings-btn {
      align-self: flex-end;
      margin-top: 0.3rem;
      font-size: 0.8rem;
      padding: 0.3rem 0.6rem;
      background: #555;
      color: #fff;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }

    /* 右側：会話（最新が上） */
    #chat {
      flex: 1;
      overflow-y: scroll;   /* 常にスクロールバー表示 */
      padding: 0.5rem;
      background: #ffffff;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 0.9rem;
    }
    .msg {
      margin-bottom: 0.5rem;
      line-height: 1.4;
    }
    .msg.user {
      text-align: right;
    }
    .msg.user span {
      background: #d1eaff;
      display: inline-block;
      padding: 0.3rem 0.6rem;
      border-radius: 16px;
      max-width: 80%;
    }
    .msg.ai span {
      background: #e8e8e8;
      display: inline-block;
      padding: 0.3rem 0.6rem;
      border-radius: 16px;
      max-width: 80%;
    }

    #input-area {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-top: 0.3rem;
    }
    #controls {
      display: flex;
      gap: 0.4rem;
      align-items: stretch;
    }
    textarea {
      width: 100%;
      min-height: 3.5rem;
      resize: vertical;
      font-size: 0.9rem;
      padding: 0.4rem;
      box-sizing: border-box;
    }
    button {
      border: none;
      border-radius: 8px;
      padding: 0.4rem 0.6rem;
      font-size: 0.9rem;
      cursor: pointer;
      background: #0066cc;
      color: #fff;
      flex-shrink: 0;
    }
    button:disabled {
      background: #999;
      cursor: not-allowed;
    }
    #mic-btn {
      background: #00a36f;
    }
    #stop-mic-btn {
      background: #cc3300;
    }
    #speed-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
    }
    #speed-row input[type="range"] {
      width: 25vw;
    }

    @media (max-width: 768px) {
      main {
        flex-direction: column;
      }
      #speed-row input[type="range"] {
        width: 50vw;
      }
    }
  </style>
</head>
<body>
  <header>Easy English Chat</header>
  <div id="status">Loading WebLLM…</div>

  <main>
    <!-- 左カラム：提案 & 設定 -->
    <div id="left-panel">
      <div id="suggestions-panel">
        <div id="suggestions-header">
          <span>Next sentences (10 ideas)</span>
          <button id="suggest-btn" style="font-size:0.8rem;padding:0.2rem 0.4rem;">
            Suggest
          </button>
        </div>
        <div id="suggestions-list"></div>
      </div>

      <div id="settings-panel">
        <div>
          <label for="theme-input">テーマ</label>
          <input
            id="theme-input"
            type="text"
            placeholder="例: レストランにて"
            value="レストランにて"
          />
        </div>
        <div>
          <label for="user-role-input">ユーザの役割</label>
          <input
            id="user-role-input"
            type="text"
            placeholder="例: 客"
            value="客"
          />
        </div>
        <div>
          <label for="ai-role-input">AIの役割</label>
          <input
            id="ai-role-input"
            type="text"
            placeholder="例: 店員"
            value="店員"
          />
        </div>
        <div>
          <label for="base-prompt-input">System prompt (AIへの指示文)</label>
          <textarea id="base-prompt-input">Use very simple English (CEFR A2 level). Answer in 1 or 2 short sentences. You should never speak a sentence longer than 20 words. Speak slowly and clearly. When you suggest example sentences, they must ALWAYS be sentences that the learner (user) could say. It is forbidden to suggest sentences spoken by the AI side. Before responding, you must check whether the user's message logically fits the current restaurant conversation. If the message is unrelated, broken, or clearly caused by speech recognition error, ignore it completely. Do not answer that incorrect message. Instead, politely ask the user to repeat or say it again. Never create new context from such invalid messages.</textarea>
        </div>
        <div>
          <label for="model-select">Model (WebLLM)</label>
          <select id="model-select">
            <option value="Qwen2.5-0.5B-Instruct-q4f32_1-MLC">
              Qwen2.5 0.5B Instruct (small / fast)
            </option>
            <option value="Qwen2.5-1.5B-Instruct-q4f32_1-MLC" selected>
              Qwen2.5 1.5B Instruct (standard)
            </option>
            <option value="Phi-3.5-mini-instruct-q4f32_1-MLC">
              Phi-3.5 mini Instruct
            </option>
            <option value="Llama-3.1-8B-Instruct-q4f32_1-MLC">
              Llama 3.1 8B Instruct
            </option>
            <option value="SmolLM2-1.7B-Instruct-q4f32_1-MLC">
              SmolLM2 1.7B Instruct
            </option>
          </select>
        </div>
        <button id="apply-settings-btn">設定を適用（会話リセット）</button>
      </div>
    </div>

    <!-- 右カラム：入力エリア → 会話エリア の順に変更 -->
    <div id="right-panel">
      <div id="input-area">
        <textarea id="user-input" placeholder="Talk to AI in English..."></textarea>
        <div id="controls">
          <button id="send-btn" disabled>Send</button>
          <button id="mic-btn" type="button">🎤 Start</button>
          <button id="stop-mic-btn" type="button" disabled>■ Stop</button>
        </div>
        <div id="speed-row">
          <span>Voice speed: <span id="speed-label">0.4x</span></span>
          <input
            type="range"
            id="speed-range"
            min="0.2"
            max="1.0"
            step="0.1"
            value="0.4"
          />
        </div>
      </div>

      <div id="chat"></div>
    </div>
  </main>

  <script type="module">
    const statusEl = document.getElementById("status");
    const chatEl = document.getElementById("chat");
    const userInputEl = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const micBtn = document.getElementById("mic-btn");
    const stopMicBtn = document.getElementById("stop-mic-btn");
    const speedRange = document.getElementById("speed-range");
    const speedLabel = document.getElementById("speed-label");

    const suggestBtn = document.getElementById("suggest-btn");
    const suggestionsList = document.getElementById("suggestions-list");

    const themeInput = document.getElementById("theme-input");
    const userRoleInput = document.getElementById("user-role-input");
    const aiRoleInput = document.getElementById("ai-role-input");
    const applySettingsBtn = document.getElementById("apply-settings-btn");
    const basePromptInput = document.getElementById("base-prompt-input");
    const modelSelect = document.getElementById("model-select");

    const defaultBasePrompt =
      "You are a friendly English teacher. Use very simple English (CEFR A2 level). " +
      "Answer in 1 or 2 short sentences. You should never speak a sentence longer than 20 words. Speak slowly and clearly. " +
      "When you suggest example sentences, they must ALWAYS be sentences that the learner (user) could say. " +
      "It is forbidden to suggest sentences spoken by the AI side. " +
      "Before responding, you must check whether the user's message logically fits the current restaurant conversation. " +
      "If the message is unrelated, broken, or clearly caused by speech recognition error, ignore it completely. " +
      "Do not answer that incorrect message. Instead, politely ask the user to repeat or say it again. " +
      "Never create new context from such invalid messages.";

    const DEFAULT_MODEL_ID = "Qwen2.5-1.5B-Instruct-q4f32_1-MLC";

    let engine = null;
    let webllm = null;

    function buildSystemPrompt() {
      const theme = (themeInput.value || "").trim() || "at a restaurant";
      const userRole = (userRoleInput.value || "").trim() || "a customer";
      const aiRole =
        (aiRoleInput.value || "").trim() || "a restaurant waiter";
      const base =
        (basePromptInput.value || "").trim() || defaultBasePrompt;

      return (
        `You are ${aiRole}. The conversation theme is: ${theme}. ` +
        `The user is ${userRole}. ` +
        base
      );
    }

    let messages = [
      {
        role: "system",
        content: buildSystemPrompt(),
      },
    ];

    function setStatus(text) {
      statusEl.textContent = text;
    }

    // 最新メッセージを一番上に表示
    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + (role === "user" ? "user" : "ai");
      const span = document.createElement("span");
      span.textContent = text;
      div.appendChild(span);
      if (chatEl.firstChild) {
        chatEl.insertBefore(div, chatEl.firstChild);
      } else {
        chatEl.appendChild(div);
      }
      chatEl.scrollTop = 0;
    }

    async function setupEngine(modelId) {
      const selected = modelId || DEFAULT_MODEL_ID;
      modelSelect.value = selected;

      sendBtn.disabled = true;
      suggestBtn.disabled = true;
      setStatus(`Loading model: ${selected} …`);

      if (!webllm) {
        webllm = await import("https://esm.run/@mlc-ai/web-llm");
      }

      try {
        if (!engine) {
          // 初回
          engine = await webllm.CreateMLCEngine(
            selected,
            {
              initProgressCallback: (p) => {
                if (p && typeof p.progress === "number") {
                  const pct = Math.round(p.progress * 100);
                  setStatus(`Downloading model… ${pct}%`);
                } else if (p && p.text) {
                  setStatus(p.text);
                }
              },
              logLevel: "INFO",
            }
          );
        } else {
          // モデル切り替え
          await engine.reload(selected, (p) => {
            if (p && typeof p.progress === "number") {
              const pct = Math.round(p.progress * 100);
              setStatus(`Switching model… ${pct}%`);
            } else if (p && p.text) {
              setStatus(p.text);
            }
          });
        }

        setStatus("Model ready. You can talk now!");
        sendBtn.disabled = false;
        suggestBtn.disabled = false;
      } catch (e) {
        console.error(e);
        setStatus("Failed to load model. See console for details.");
      }
    }

    // 初期モデル読み込み
    await setupEngine(DEFAULT_MODEL_ID);

    // ===== テキスト送信 =====
    async function sendMessage() {
      const text = userInputEl.value.trim();
      if (!text || !engine) return;

      userInputEl.value = "";
      addMessage("user", text);
      messages.push({ role: "user", content: text });

      sendBtn.disabled = true;
      setStatus("Thinking…");

      try {
        const reply = await engine.chat.completions.create({
          messages,
        });
        const aiText = reply.choices[0].message.content;
        messages.push({ role: "assistant", content: aiText });
        addMessage("assistant", aiText);
        setStatus("Ready");
        speakText(aiText);

        // 返事のたびに提案を更新
        generateSuggestions(true);
      } catch (e) {
        console.error(e);
        setStatus("Error while generating reply.");
      } finally {
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    userInputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // ===== 設定適用 =====
    applySettingsBtn.addEventListener("click", () => {
      messages = [
        {
          role: "system",
          content: buildSystemPrompt(),
        },
      ];
      chatEl.innerHTML = "";
      suggestionsList.innerHTML = "";
      setStatus("Settings updated. Conversation reset.");
    });

    // ===== モデル切り替え =====
    modelSelect.addEventListener("change", async () => {
      const newId = modelSelect.value;
      // 会話リセット
      messages = [
        {
          role: "system",
          content: buildSystemPrompt(),
        },
      ];
      chatEl.innerHTML = "";
      suggestionsList.innerHTML = "";
      await setupEngine(newId);
    });

    // ===== 次に話す文の提案 =====
    async function generateSuggestions(auto = false) {
      if (!engine) return;

      if (!auto) {
        suggestBtn.disabled = true;
        suggestionsList.textContent = "Generating suggestions…";
      } else {
        suggestionsList.textContent = "Updating suggestions…";
      }

      try {
        const prompt =
          "Based on our conversation so far and the theme, suggest 10 different short English sentences that the user (learner) could say next. " +
          "All sentences must be from the user's point of view, not the AI's. " +
          "Use very simple English (CEFR A2). Output each sentence on a new line, starting with a number like '1.'";

        const reply = await engine.chat.completions.create({
          messages: [...messages, { role: "user", content: prompt }],
          temperature: 0.8,
          max_tokens: 120,
        });

        const text = reply.choices[0].message.content || "";
        const lines = text.split(/\n+/);
        const cleaned = [];
        for (const line of lines) {
          let s = line.trim();
          if (!s) continue;
          s = s.replace(/^\d+[\.\)]\s*/, "");
          if (s) cleaned.push(s);
          if (cleaned.length >= 10) break;
        }

        suggestionsList.innerHTML = "";
        if (cleaned.length === 0) {
          suggestionsList.textContent = "No suggestions.";
        } else {
          cleaned.forEach((sentence) => {
            const div = document.createElement("div");
            div.className = "suggestion-item";
            div.textContent = sentence;
            div.addEventListener("click", () => {
              userInputEl.value = sentence;
              userInputEl.focus();
            });
            suggestionsList.appendChild(div);
          });
        }
      } catch (e) {
        console.error(e);
        suggestionsList.textContent = "Failed to generate suggestions.";
      } finally {
        if (!auto) suggestBtn.disabled = false;
      }
    }

    suggestBtn.addEventListener("click", () => generateSuggestions(false));

    // ===== TTS =====
    let speaking = false;

    function speakText(text) {
      if (!("speechSynthesis" in window)) {
        console.warn("Speech Synthesis not supported in this browser.");
        return;
      }
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "en-US";
      utter.rate = parseFloat(speedRange.value);
      speaking = true;

      if (recognition && recognizing) recognition.stop();
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utter);

      utter.onend = () => {
        speaking = false;
        if (continuousConversation) {
          setTimeout(() => startListening(), 400);
        }
      };
    }

    speedRange.addEventListener("input", () => {
      speedLabel.textContent = speedRange.value + "x";
    });

    // ===== 音声認識 =====
    let recognition = null;
    let recognizing = false;
    let continuousConversation = false;

    function startListening() {
      if (!recognition || recognizing) return;
      try {
        recognition.start();
      } catch (e) {
        console.error("recognition.start error:", e);
      }
    }

    if ("webkitSpeechRecognition" in window || "SpeechRecognition" in window) {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SR();
      recognition.lang = "en-US";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        recognizing = true;
        setStatus("Listening… Speak now.");
      };

      recognition.onend = () => {
        recognizing = false;
        if (!continuousConversation) {
          setStatus("Ready");
        } else if (!speaking) {
          setTimeout(() => startListening(), 400);
        }
      };

      recognition.onerror = (event) => {
        console.error("Speech recognition error:", event);
        setStatus("Speech recognition error");
      };

      recognition.onresult = (event) => {
        const result = event.results[0][0].transcript;
        userInputEl.value = result;
        sendMessage();
      };
    } else {
      setStatus(
        "Model ready, but speech recognition is not supported in this browser."
      );
      micBtn.disabled = true;
      stopMicBtn.disabled = true;
    }

    micBtn.addEventListener("click", () => {
      if (!recognition) return;
      if (!continuousConversation) {
        continuousConversation = true;
        setStatus("Voice chat started. Speak after the AI finishes.");
        micBtn.disabled = true;
        stopMicBtn.disabled = false;
        startListening();
      }
    });

    stopMicBtn.addEventListener("click", () => {
      continuousConversation = false;
      if (recognition && recognizing) recognition.stop();
      window.speechSynthesis.cancel();
      micBtn.disabled = false;
      stopMicBtn.disabled = true;
      setStatus("Voice chat stopped. You can still type messages.");
    });
  </script>
</body>
</html>
